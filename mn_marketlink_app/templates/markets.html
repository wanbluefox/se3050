
{% extends "base.html" %}
{% block content %}
<h1>Farmers Markets</h1>
<table class="table">
  <tr><th>Name</th><th>City</th><th>Date</th><th>Time</th></tr>
  {% for m in markets %}
  <tr>
    <td><a href="{{ url_for('market_detail', market_id=m.market_id) }}">{{ m.name }}</a></td>
    <td>{{ m.city }}</td>
    <td>{{ m.market_date }}</td>
    <td>{{ m.start_time }} - {{ m.end_time }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
